[package]
name = "crumbtrail"
version = "0.1.0"
description = "Create polished process guides while you work"
authors = ["Crumbtrail contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/thisistoni/Crumbtrail"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "crumbtrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri serves `devUrl` unless its custom protocol is enabled. Keep this on by
# default so plain `cargo build --release` produces a truly standalone app.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
ab_glyph = "0.2"
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows-capture = "2.0.0"
windows-icons = "0.4.0"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
